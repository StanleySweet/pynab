services:
    # Pynab services
    pynab:
        container_name: Pynab
        build:
            context: ..
            dockerfile: Docker/nab/Dockerfile
        volumes:
          - ../:/opt/pynab
          - pynab-data:/opt/pynab/data
        environment:
          - TZ=Europe/Paris
        command: ["/bin/bash", "/usr/local/bin/run-pynab.sh"]
        ports:
          - 10543:10543
          - 8000:8000
volumes:
    # Persist data (SQLite db, uploaded files, etc.) across restarts
    pynab-data:
