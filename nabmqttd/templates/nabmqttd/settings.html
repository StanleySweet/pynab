{% load i18n %}
<div class="card" id="nabmqttd-settings">
  <form action="/nabmqttd/settings">
    {% csrf_token %}
    <div class="card-header">
      <h5 class="card-title">{% trans "MQTT" %}</h5>
    </div>
    <div class="card-body">
      <p>{% trans "MQTT bridge connects your Nabaztag to Home Assistant or any MQTT client. Configure your broker below." %}</p>

      <div class="form-group row">
        <label for="broker_host" class="col-6 col-form-label">{% trans "Broker host" %}</label>
        <div class="col-6">
          <input id="broker_host" name="broker_host" type="text" class="form-control" value="{{ config.broker_host }}">
        </div>
      </div>

      <div class="form-group row">
        <label for="broker_port" class="col-6 col-form-label">{% trans "Broker port" %}</label>
        <div class="col-6">
          <input id="broker_port" name="broker_port" type="number" class="form-control" value="{{ config.broker_port }}">
        </div>
      </div>

      <div class="form-group row">
        <label for="broker_username" class="col-6 col-form-label">{% trans "Username" %}</label>
        <div class="col-6">
          <input id="broker_username" name="broker_username" type="text" class="form-control" value="{{ config.broker_username }}">
        </div>
      </div>

      <div class="form-group row">
        <label for="broker_password" class="col-6 col-form-label">{% trans "Password" %}</label>
        <div class="col-6">
          <input id="broker_password" name="broker_password" type="password" class="form-control" value="{{ config.broker_password }}">
        </div>
      </div>

      <div class="form-group row">
        <label for="broker_tls" class="col-6 col-form-label">{% trans "TLS" %}</label>
        <div class="col-6">
          <button id="broker_tls" type="button" class="btn btn-toggle{% if config.broker_tls %} active{% endif %}" data-name="broker_tls" data-toggle="button" aria-pressed="false" autocomplete="off"><div class="handle"></div></button>
          <input name="broker_tls" type="hidden" value="{% if config.broker_tls %}true{% else %}false{% endif %}" />
        </div>
      </div>

      <div class="form-group row">
        <label for="device_id" class="col-6 col-form-label">{% trans "Device ID" %}</label>
        <div class="col-6">
          <input id="device_id" name="device_id" type="text" class="form-control" value="{{ config.device_id }}" placeholder="{% trans "Auto-detected if empty" %}">
        </div>
      </div>

      <div class="form-group row">
        <label for="discovery_prefix" class="col-6 col-form-label">{% trans "HA discovery prefix" %}</label>
        <div class="col-6">
          <input id="discovery_prefix" name="discovery_prefix" type="text" class="form-control" value="{{ config.discovery_prefix }}">
        </div>
      </div>

      <div class="form-group row">
        <label for="topic_prefix" class="col-6 col-form-label">{% trans "Topic prefix" %}</label>
        <div class="col-6">
          <input id="topic_prefix" name="topic_prefix" type="text" class="form-control" value="{{ config.topic_prefix }}">
        </div>
      </div>

      <div class="form-group row">
        <label for="default_radio_url" class="col-6 col-form-label">{% trans "Default radio URL" %}</label>
        <div class="col-6">
          <input id="default_radio_url" name="default_radio_url" type="text" class="form-control" value="{{ config.default_radio_url }}" placeholder="{% trans "http://stream.url/mp3" %}">
        </div>
      </div>

    </div>
    <div class="card-footer">
      <div class="row mb-2">
        <div class="col-12">
          <button type="submit" class="btn btn-primary disabled ml-2 float-right save-button">{% trans "Save" %}</button>
          <button type="reset" class="btn btn-outline-primary disabled ml-2 float-right reset-button">{% trans "Reset" %}</button>
        </div>
      </div>
    </div>
  </form>
  <script type="text/javascript">
  $(function() {
    var form = $('#nabmqttd-settings form');
    var saveBtn = form.find('button.save-button');
    var resetBtn = form.find('button.reset-button');
    var url = form.attr('action');
    form.find('button.btn-toggle').on('click', function() {
      saveBtn.removeClass('disabled');
      resetBtn.removeClass('disabled');
    });
    form.find('input').on('change', function() {
      saveBtn.removeClass('disabled');
      resetBtn.removeClass('disabled');
    });
    form.on('submit', function() {
      form.find("input[name='broker_tls']").val(form.find('button.btn-toggle').hasClass('active') ? 'true' : 'false');
      var formdata = form.serialize();
      $.ajax({
        url: url,
        method: "POST",
        data: formdata,
        success: function (data) {
          $("#nabmqttd-settings").replaceWith(data);
        }
      });
      return false;
    });
    resetBtn.on("click", function() {
      $.get(url, function(data) {
        $("#nabmqttd-settings").replaceWith(data);
      });
    });
  });
  </script>
</div>
