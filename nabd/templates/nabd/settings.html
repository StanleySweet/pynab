{% load i18n %}
<div class="card" id="nabd-settings">
  <form action="/nabd/settings">
    {% csrf_token %}
    <div class="card-header">
      <h5 class="card-title">{% trans "Rabbit" %}</h5>
    </div>
    <div class="card-body">
      <div class="form-group row">
        <label for="bottomLedColor" class="col-6 col-form-label">{% trans "Bottom LED color" %}</label>
        <div class="col-6">
          <input id="bottomLedColor" name="bottom_led_color" type="color" class="form-control" value="{{ config.bottom_led_color }}" />
        </div>
      </div>
      <p class="text-muted small">{% trans "The bottom LED breathes this color when the rabbit is idle and connected." %}</p>
    </div>
    <div class="card-footer">
      <div class="row mb-2">
        <div class="col-12">
          <button type="submit" class="btn btn-primary disabled ml-2 float-right save-button">{% trans "Save" %}</button>
          <button type="reset" class="btn btn-outline-primary disabled ml-2 float-right reset-button">{% trans "Reset" %}</button>
        </div>
      </div>
    </div>
  </form>
  <script type="text/javascript">
  $(function() {
    var form = $('#nabd-settings form');
    var saveBtn = form.find('button.save-button');
    var resetBtn = form.find('button.reset-button');
    var url = form.attr('action');
    form.find('input').on('change', function() {
      saveBtn.removeClass('disabled');
      resetBtn.removeClass('disabled');
    });
    form.on('submit', function() {
      var formdata = form.serialize();
      $.ajax({
        url: url,
        method: "POST",
        data: formdata,
        success: function (data) {
          $("#nabd-settings").replaceWith(data);
        }
      });
      return false;
    });
    resetBtn.on("click", function() {
      $.get(url, function(data) {
        $("#nabd-settings").replaceWith(data);
      });
    });
  });
  </script>
</div>
