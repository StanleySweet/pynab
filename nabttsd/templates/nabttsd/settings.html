{% load i18n %}
<div class="card" id="nabttsd-settings">
  <form action="/nabttsd/settings" method="post">
    {% csrf_token %}
    <div class="card-header">
      <h5 class="card-title">{% trans "Text to Speech" %}</h5>
    </div>
    <div class="card-body">
      <div class="form-group row">
        <label for="enableBtn" class="col-6 col-form-label">{% trans "Enabled" %}</label>
        <div class="col-6">
          <button id="enableBtn" type="button" class="btn btn-toggle{% if config.enabled %} active{% endif %}" data-name="enabled" data-toggle="button" aria-pressed="false" autocomplete="off"><div class="handle"></div></button>
          <input name="enabled" type="hidden" value="{% if config.enabled %}true{% else %}false{% endif %}" />
        </div>
      </div>
      <div class="form-group row">
        <label for="engineSel" class="col-6 col-form-label">{% trans "TTS engine" %}</label>
        <div class="col-6">
          <select name="engine" id="engineSel">
            <option value="piper" {% if config.engine == "piper" %}selected{% endif %}>{% trans "Piper (local)" %}</option>
            <option value="elevenlabs" {% if config.engine == "elevenlabs" %}selected{% endif %}>{% trans "ElevenLabs" %}</option>
          </select>
        </div>
      </div>
      <div class="form-group row">
        <label for="voiceInput" class="col-6 col-form-label">{% trans "Voice" %}</label>
        <div class="col-6">
          <input id="voiceInput" name="voice" type="text" class="form-control" value="{{ config.voice }}" />
        </div>
      </div>
      <div class="form-group row">
        <label for="ttsAddrInput" class="col-6 col-form-label">{% trans "TTS server (host:port)" %}</label>
        <div class="col-6">
          <input id="ttsAddrInput" name="tts_addr" type="text" class="form-control" value="{{ config.tts_addr }}" />
        </div>
      </div>
    </div>
    <div class="card-footer">
      <div class="row mb-2">
        <div class="col-12">
          <button type="submit" class="btn btn-primary disabled ml-2 float-right save-button">{% trans "Save" %}</button>
          <button type="reset" class="btn btn-outline-primary disabled ml-2 float-right reset-button">{% trans "Reset" %}</button>
        </div>
      </div>
    </div>
  </form>
  <script type="text/javascript">
  $(function() {
    var form = $('#nabttsd-settings form');
    var saveBtn = form.find('button.save-button');
    var resetBtn = form.find('button.reset-button');
    var url = form.attr('action');
    form.find('button.btn-toggle').on('click', function() {
      saveBtn.removeClass('disabled');
      resetBtn.removeClass('disabled');
    });
    form.find('input').on('change keyup', function() {
      saveBtn.removeClass('disabled');
      resetBtn.removeClass('disabled');
    });
    form.find('select').on('change', function() {
      saveBtn.removeClass('disabled');
      resetBtn.removeClass('disabled');
    });
    form.on('submit', function() {
      form.find("input[name='enabled']").val(form.find("button[id='enableBtn']").hasClass('active'));
      var formdata = form.serialize();
      $.ajax({
        url: url,
        method: "POST",
        data: formdata,
        success: function (data) {
          $("#nabttsd-settings").replaceWith(data);
        }
      });
      return false;
    });
    resetBtn.on("click", function() {
      $.get(url, function(data) {
        $("#nabttsd-settings").replaceWith(data);
      });
    });
  });
  </script>
</div>
