{% load i18n %}
<div class="card" id="nabwebhook-settings">
  <form action="/nabwebhook/settings">
    {% csrf_token %}
    <div class="card-header">
      <h5 class="card-title">{% trans "Webhook" %}</h5>
    </div>
    <div class="card-body">
      <div class="form-group row">
        <label for="webhook_url" class="col-6 col-form-label">{% trans "Default webhook URL" %}</label>
        <div class="col-6">
          <input id="webhook_url" name="webhook_url" type="text" class="form-control" value="{{ config.webhook_url }}" placeholder="{% trans "https://example.com/webhook" %}">
        </div>
      </div>
      <p>{% trans "You can also configure webhook URLs on NFC tags via the RFID section." %}</p>
    </div>
    <div class="card-footer">
      <div class="row mb-2">
        <div class="col-12">
          <button type="submit" class="btn btn-primary disabled ml-2 float-right save-button">{% trans "Save" %}</button>
          <button type="reset" class="btn btn-outline-primary disabled ml-2 float-right reset-button">{% trans "Reset" %}</button>
        </div>
      </div>
    </div>
  </form>
  <script type="text/javascript">
  $(function() {
    var form = $('#nabwebhook-settings form');
    var saveBtn = form.find('button.save-button');
    var resetBtn = form.find('button.reset-button');
    var url = form.attr('action');
    form.find('input').on('change keyup', function() {
      saveBtn.removeClass('disabled');
      resetBtn.removeClass('disabled');
    });
    form.on('submit', function() {
      var formdata = form.serialize();
      $.ajax({
        url: url,
        method: "POST",
        data: formdata,
        success: function (data) {
          $("#nabwebhook-settings").replaceWith(data);
        }
      });
      return false;
    });
    resetBtn.on("click", function() {
      $.get(url, function(data) {
        $("#nabwebhook-settings").replaceWith(data);
      });
    });
  });
  </script>
</div>
